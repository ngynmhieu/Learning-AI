services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.backend
    environment:
      MODELS_SERVICE_URL: http://models:8001/v1
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  models:
    build:
      context: .
      dockerfile: models/Dockerfile
    volumes:
      - ${USERPROFILE}/.cache/huggingface:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      start_period: 45m
