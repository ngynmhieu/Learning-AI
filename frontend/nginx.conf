resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets: cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Streaming endpoints: buffering must stay off or SSE/NDJSON arrives in one lump.
    location /chat {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    location ^~ /read/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /models {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /conversations {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /auth {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback — must come after every proxy location above.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
